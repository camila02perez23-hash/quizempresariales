<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clubes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { background: #1a237e; }
        .navbar-brand, .nav-link { color: #FFD600 !important; font-weight: 600; }
        .nav-link:hover { color: #fff !important; }
        thead { background: #1a237e; color: white; }
        .btn-editar { background: #1565c0; color: white; border: none; }
        .btn-editar:hover { background: #0d47a1; color: white; }
        .btn-eliminar { background: #c62828; color: white; border: none; }
        .btn-eliminar:hover { background: #b71c1c; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">Club Fútbol</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/asociaciones}">Asociaciones</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clubes}">Clubs</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/competiciones}">Competiciones</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/entrenadores}">Entrenadores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jugadores}">Jugadores</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Lista de Clubs</h3>
        <div>
            <a th:href="@{/clubes/nuevo}" class="btn btn-primary">Crear Nuevo Club</a>
            <a th:href="@{/}" class="btn btn-secondary ms-2">Volver Inicio</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Entrenador</th>
                <th>Asociación</th>
                <th>Competiciones</th>
                <th>Estadio</th>
                <th>Año Fundación</th>
                <th>N° Jugadores</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="club, clubStat : ${clubes}">
                <td th:text="${clubStat.index + 1}"></td>
                <td th:text="${club.nombre}"></td>
                <td th:text="${club.entrenador != null ?
                    club.entrenador.nombre + ' ' + club.entrenador.apellido : '-'}">
                </td>
                <td th:text="${club.asociacion != null ? club.asociacion.nombre : '-'}"></td>
                <td>
                    <span th:if="${club.competiciones != null and not #lists.isEmpty(club.competiciones)}">
                        <span th:each="comp, i : ${club.competiciones}">
                            <span th:text="${comp.nombre}"></span>
                            <span th:if="${!i.last}">, </span>
                        </span>
                    </span>
                    <span th:if="${club.competiciones == null or #lists.isEmpty(club.competiciones)}">-</span>
                </td>
                <td th:text="${club.estadio}"></td>
                <td th:text="${club.anioFundacion}"></td>
                <td th:text="${club.numeroJugadores}"></td>
                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/clubes/editar/{id}(id=${club.id})}"
                           class="btn btn-editar btn-sm">Editar</a>
                        <a th:href="@{/clubes/eliminar/{id}(id=${club.id})}"
                           class="btn btn-eliminar btn-sm"
                           onclick="return confirm('¿Eliminar este club?')">Eliminar</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clubes)}">
                <td colspan="9" class="text-center text-muted py-3">No hay clubs registrados</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
